services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD}"
      NEXACONNECT_MIGRATION_PASSWORD: "${NEXACONNECT_MIGRATION_PASSWORD}"
      PLATFORM_DIRECTORY_DB_PASSWORD: "${PLATFORM_DIRECTORY_DB_PASSWORD}"
      RESTAURANT_DB_PASSWORD: "${RESTAURANT_DB_PASSWORD}"
      CATALOG_DB_PASSWORD: "${CATALOG_DB_PASSWORD}"
      INVENTORY_DB_PASSWORD: "${INVENTORY_DB_PASSWORD}"
      ORDER_DB_PASSWORD: "${ORDER_DB_PASSWORD}"
      KITCHEN_DB_PASSWORD: "${KITCHEN_DB_PASSWORD}"
      CUSTOMER_DB_PASSWORD: "${CUSTOMER_DB_PASSWORD}"
      PAYMENT_DB_PASSWORD: "${PAYMENT_DB_PASSWORD}"
      POS_DB_PASSWORD: "${POS_DB_PASSWORD}"
      MEDIA_DB_PASSWORD: "${MEDIA_DB_PASSWORD}"
      REPORTING_DB_PASSWORD: "${REPORTING_DB_PASSWORD}"
      AUTHORIZATION_DB_PASSWORD: "${AUTHORIZATION_DB_PASSWORD}"
      NOTIFICATION_DB_PASSWORD: "${NOTIFICATION_DB_PASSWORD}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      NEXA_REALM_NAME: "${KEYCLOAK_REALM:-nexa-dev}"
      NEXA_REALM_DISPLAY_NAME: "${KEYCLOAK_REALM_DISPLAY_NAME:-Nexa Development}"
      NEXA_VERIFY_EMAIL: "false"
      NEXA_REQUIRE_MFA: "false"
      NEXA_SMTP_HOST: "${KEYCLOAK_SMTP_HOST:-localhost}"
      NEXA_SMTP_PORT: "${KEYCLOAK_SMTP_PORT:-1025}"
      NEXA_SMTP_FROM: "${KEYCLOAK_SMTP_FROM:-noreply@nexa.local}"
      NEXA_SMTP_FROM_DISPLAY_NAME: "${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:-Nexa Development}"
      NEXA_SMTP_AUTH: "${KEYCLOAK_SMTP_AUTH:-false}"
      NEXA_SMTP_USER: "${KEYCLOAK_SMTP_USER:-}"
      NEXA_SMTP_PASSWORD: "${KEYCLOAK_SMTP_PASSWORD:-}"
      NEXA_SMTP_STARTTLS: "${KEYCLOAK_SMTP_STARTTLS:-false}"
      NEXA_SMTP_SSL: "${KEYCLOAK_SMTP_SSL:-false}"
      NEXACONNECT_WEB_BFF_CLIENT_SECRET: "${NEXACONNECT_WEB_BFF_CLIENT_SECRET:-local-dev-only-change-me}"
      NEXACONNECT_ADMIN_BFF_CLIENT_SECRET: "${NEXACONNECT_ADMIN_BFF_CLIENT_SECRET:-local-dev-only-change-me}"
      NEXACONNECT_POS_SERVICE_CLIENT_SECRET: "${NEXACONNECT_POS_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}"
      NEXACONNECT_CATALOG_SERVICE_CLIENT_SECRET: "${NEXACONNECT_CATALOG_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}"
      NEXACONNECT_ORDER_SERVICE_CLIENT_SECRET: "${NEXACONNECT_ORDER_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}"
      NEXACONNECT_INVENTORY_SERVICE_CLIENT_SECRET: "${NEXACONNECT_INVENTORY_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}"
      NEXACONNECT_PAYMENT_SERVICE_CLIENT_SECRET: "${NEXACONNECT_PAYMENT_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}"
      NEXACONNECT_MEDIA_SERVICE_CLIENT_SECRET: "${NEXACONNECT_MEDIA_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}"
      PLATFORM_ADMIN_BFF_CLIENT_SECRET: "${PLATFORM_ADMIN_BFF_CLIENT_SECRET:-local-dev-only-change-me}"
      PLATFORM_DIRECTORY_ADMIN_CLIENT_SECRET: "${PLATFORM_DIRECTORY_ADMIN_CLIENT_SECRET:-local-dev-only-change-me}"
      PLATFORM_ADMIN_BFF_REDIRECT_URI: "${PLATFORM_ADMIN_BFF_REDIRECT_URI:-https://localhost:58527/signin-oidc}"
      PLATFORM_ADMIN_BFF_ORIGIN: "${PLATFORM_ADMIN_BFF_ORIGIN:-https://localhost:58527}"
      NEXACONNECT_WEB_BFF_REDIRECT_URI: "${NEXACONNECT_WEB_BFF_REDIRECT_URI:-https://localhost:7100/signin-oidc}"
      NEXACONNECT_WEB_BFF_POST_LOGOUT_REDIRECT_URI: "${NEXACONNECT_WEB_BFF_POST_LOGOUT_REDIRECT_URI:-https://localhost:7100/signout-callback-oidc}"
      NEXACONNECT_WEB_ORIGIN: "${NEXACONNECT_WEB_ORIGIN:-https://localhost:7100}"
      NEXACONNECT_ADMIN_BFF_REDIRECT_URI: "${NEXACONNECT_ADMIN_BFF_REDIRECT_URI:-https://localhost:7200/signin-oidc}"
      NEXACONNECT_ADMIN_BFF_POST_LOGOUT_REDIRECT_URI: "${NEXACONNECT_ADMIN_BFF_POST_LOGOUT_REDIRECT_URI:-https://localhost:7200/signout-callback-oidc}"
      NEXACONNECT_ADMIN_ORIGIN: "${NEXACONNECT_ADMIN_ORIGIN:-https://localhost:7200}"
      NEXACONNECT_MOBILE_REDIRECT_URI: "${NEXACONNECT_MOBILE_REDIRECT_URI:-nexaconnect://oauth/callback}"
      NEXACONNECT_POS_REDIRECT_URI: "${NEXACONNECT_POS_REDIRECT_URI:-nexaconnect-pos://oauth/callback}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./docker/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q '200 OK'; } 0<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  loki:
    image: grafana/loki:3.5.5
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources/loki.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
    depends_on:
      - loki

  clamav:
    image: clamav/clamav:1.4.3
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-nexaconnect-local}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/nexaconnect-media &&
        mc anonymous set none local/nexaconnect-media
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-nexaconnect-local}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"

volumes:
  postgres-data:
  keycloak-db-data:
  loki-data:
  grafana-data:
  minio-data:
  clamav-data:
