name: Frontend dependency and compatibility verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install exact lockfile without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit production dependency tree
        run: npm run audit:production
      - name: Audit full build and test dependency tree
        run: npm run audit:all
      - name: Check TypeScript
        run: npm run check
      - name: Run frontend unit contracts
        run: npm test
      - name: Build both portals
        run: npm run build
