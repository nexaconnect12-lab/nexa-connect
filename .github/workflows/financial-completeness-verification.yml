name: Financial completeness verification
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financial-completeness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Joined financial-completeness portal gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate workload audience configuration
        run: ./scripts/test-keycloak-realm.ps1
      - name: Verify authorization policy and audit failure behavior
        run: dotnet test tests/Unit/NexaConnect.UnitTests --filter "FullyQualifiedName~AuthorizationPolicyTests|FullyQualifiedName~ReportingTenantAuthorizationTests" --verbosity minimal
      - name: Verify authorization domain boundaries
        run: dotnet test tests/Architecture/NexaConnect.ArchitectureTests --filter FullyQualifiedName~AuthorizationDomainDependencyTests --verbosity minimal
      - name: Prepare browser and validate acceptance guards
        working-directory: src/Frontend
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run audit:production
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run audit:all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test e2e/financial-completeness-live/settings.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run real OIDC portal matrix without skips
        run: ./scripts/test-financial-completeness-portal.ps1 -ConfirmDisposableInfrastructure
      - name: Retain bounded portal verification only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: financial-completeness-portal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runstate/financial-portal/*/verification.json
            src/Frontend/test-results/financial-completeness-live/*/summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
